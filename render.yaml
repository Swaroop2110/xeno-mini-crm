services:
  - type: web
    name: xeno-crm-backend
    env: node
    plan: free
    region: singapore
    buildCommand: "cd crm-backend && npm install"
    startCommand: "cd crm-backend && npx tsx src/index.ts"
    envVars:
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CHANNEL_SERVICE_URL
        value: "https://xeno-channel-service.onrender.com"
      
  - type: web
    name: xeno-channel-service
    env: node
    plan: free
    region: singapore
    buildCommand: "cd channel-service && npm install"
    startCommand: "cd channel-service && npx tsx src/index.ts"
    envVars:
      - key: PORT
        value: 10000
      - key: CRM_RECEIPT_URL
        value: "https://xeno-crm-backend.onrender.com/api/receipt"
